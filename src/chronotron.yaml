# Chronotron - NTP/GPS Display Configuration File
# This file contains all configuration parameters for the chronotron display driver

# Global Options Configuration
# These settings apply to all displays and layouts.
options:
  # Backlight control. Can be "on" (always on), "off" (always off), or a time range dictionary
  backlight: on

  # backlight: 
  #   # HH:MM when backlight turns ON
  #   start_time: "07:00"
  #    
  #   # HH:MM when backlight turns OFF
  #   end_time: "21:00"
  
  # Display time as UTC instead of local time
  display_utc_time: false

  # Time in seconds between display updates (default: 0.5)
  display_refresh_interval: 0.5


# Layout Configuration
# Layouts are responsible for formatting display content. Multiple displays can share the same layout.
# You must have at least one. If you don't specify a layout on every display, you need one with id "default".
layouts:
  - id: default
    type: DefaultFourLineLayout

  # Example: Custom layout with configurable line formatting. This example is pretty much identical to chronotron v2's layout.
  # - id: my_layout
  #   type: CustomLayout
  #   lines:
  #     - left: "{time.strftime('%Y-%m-%d', current_time)} "
  #       right: "{time.strftime('%H:%M:%S', current_time)}"
  #     - left: "S[{stratum or '?'}] "
  #       right: "{f'{system_time_offset:+.9f}' if system_time_offset else '?'}sec"
  #     - "L[{'*' if is_locked else ' '}] {source}"
  #     - left: "F[{mode}] {sats_used}/{sats} "
  #       right: "{layout._format_signed_offset(adjusted_offset) or '?'}"

# Displays Configuration
# List of display devices to output status information to. You can use multiple displays simultaneously (e.g. LCD + file logging)
# Displays Configuration
# List of display devices to output status information to. You can use multiple displays simultaneously (e.g. LCD + file logging)
# Each display can reference a layout by id. If no layout is specified, defaults to "default".
displays:
  # HD44780-based LCD Display via I2C (supports both PCF8574 and Adafruit MCP23008 I2C converters)
  # - type: "hd44780"
  #   layout: default   # Reference layout by id (optional, defaults to "default")
  #   
  #   # I2C bus number (1 for Raspberry Pi 2+, 0 for Raspberry Pi 1)
  #   sm_bus: 1
  #   
  #   # I2C address of the display
  #   # Common values:
  #   #   0x27 (39 decimal) - Most common, used by PCF8574 adapter
  #   #   0x20 (32 decimal) - Adafruit with MCP23008 chip
  #   i2c_address: 0x27
  #   
  #   # Set to true if using Adafruit I2C adapter with MCP23008 chip
  #   # Set to false for all others (most use PCF8574/PCF8585)
  #   adafruit_hardware: false
  #   
  #   # LCD display update timing mode
  #   # false = Standard slow update per HD44780 specification (safe, slow)
  #   # true  = Fast update with low latency (exceeds specs, set to false if display issues)
  #   fast_update: false
  #   
  #   # Display dimensions
  #   cols: 20  # Characters per row
  #   rows: 4   # Number of rows

  # Uncomment below to enable file-based display output for debugging/testing
  # Note: this will grow without bounds and thrash your SD card, so is only for testing
  # - type: "file_output"
  #   layout: my_layout  # Reference layout by id (optional, defaults to "default")
  #   file: "-"  # Path to output file, relative to cwd if not absolute. use "-" for stdout
  #   cols: 20
  #   rows: 4

  # OLED display using luma.oled. Only I2C is supported for now.
  - type: "oled"
    device: "ssd1306"
    i2c:
  #     # bus: 1
  #     # address: 0x3c
  #   # width: 128 # leave unset for device default
  #   # height: 64 # leave unset for device default
  #   # rotate: 1  # Rotation (0 = normal, 1 = 90°, 2 = 180°, 3 = 270°)
  #   # Optional path to a TTF font file. If omitted, the default font (which may be proportionately spaced) is used.
  #   # font: "/home/david/DejaVuSansMono.ttf"
  # Uncomment below to enable rich terminal output display (LCD-style)
  - type: "rich_terminal"
    cols: 20
    rows: 4
    backlight_on_style: "bright_cyan on blue"
    backlight_off_style: "cyan on black"

# Gpsd Configuration
# Settings for GPS status monitoring
gpsd:
  host: "192.168.10.249"  # gpsd host (default: localhost)
  port: 2947              # gpsd port (default: 2947)

# Chrony Configuration
# Settings for NTP synchronisation status monitoring
chrony:
  method: "socket"        # Method to query chronyd ("socket" or "chronyc", default: socket)
  host: "192.168.10.249"  # chronyd host (default: 127.0.0.1)
  port: 323               # chronyd port (default: 323)
  data_update_interval: 1 # Time in seconds between Chrony statistics updates (default: 1)
